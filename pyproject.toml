[tool.poetry]
name = "ScreenPro2"
description = "Flexible analysis of high-content CRISPR screening"
version = "0.7.0"
authors = [
	"Abolfazl Arab <abolfazl.arab@ucsf.edu>",
	"Nick Youngblut <nick.youngblut@arcinstitute.org>",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ArcInstitute/ScreenPro2"
repository = "https://github.com/ArcInstitute/ScreenPro2"
keywords = ["CRISPR", "screening", "bioinformatics"]
packages = [
	{ include = "screenpro" },
	{ include = "pyproject.toml" },
]
dynamic = ["version"]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
pandas = "<2.0"
numpy = "<2.0"
scipy = "*"
matplotlib = "<3.7"
bokeh = "*"
anndata = "*"
scanpy = "*"
polars = ">0.20"
pyarrow = "<26"
biobear = "*"
pydeseq2 = "<0.5"
statsmodels = "*"
scikit-learn = "*"
simple_colors = "*"
adjustText = "*"

[tool.poetry.scripts]
screenpro = "screenpro.main:main"

[tool.poetry.group.test.dependencies]
pytest = "*"
tomli = "*"

[tool.poetry-dynamic-versioning]
enable = true

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"